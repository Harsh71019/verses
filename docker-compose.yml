services:
  verses:
    container_name: verses
    image: verses:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3009:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
